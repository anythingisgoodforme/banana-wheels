name: Publish Game Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes'
        required: false
        default: 'New game release'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint and test
        run: npm run lint && npm test -- --passWithNoTests

      - name: Build game
        run: npm run build

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎮 Game Release

            This release includes the latest version of the banana-wheels game.

            ### How to Play
            1. Download the game files or clone the repository
            2. Run `npm install` to set up dependencies
            3. Run `npm start` to play the game locally

            ### What's New
            Check the commits since the last release for details about changes.
